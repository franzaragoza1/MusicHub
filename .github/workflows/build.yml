name: Compilar MusicHub

# Se ejecuta al hacer push a main, al crear una etiqueta vX.Y (que genera una
# Release con los ejecutables), y a mano desde la pestaña "Actions" (Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
          - os: macos-14   # Apple Silicon (M1/M2/M3/M4): runners con disponibilidad real
            nombre: macOS

    runs-on: ${{ matrix.os }}
    name: Compilar (${{ matrix.nombre }})

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Opcional: si defines el secreto MUSICHUB_GROQ_KEY en el repo, se incrusta
      # en el ejecutable para que la IA (Groq) funcione sin configurar nada.
      # El archivo está en .gitignore: nunca se sube al repositorio.
      - name: Incrustar clave gratis de Groq (opcional)
        shell: python
        env:
          GK: ${{ secrets.MUSICHUB_GROQ_KEY }}
        run: |
          import os
          gk = os.environ.get("GK", "")
          if gk:
              with open("_clave_embebida.py", "w", encoding="utf-8") as f:
                  f.write("GROQ_KEY = %r\n" % gk)
              print("Clave Groq incrustada en el build.")
          else:
              print("Sin secreto MUSICHUB_GROQ_KEY: la app pedira la clave en Ajustes.")

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm MusicHub.spec

      # ---- Windows: instalador de un solo archivo (Inno Setup) ----
      - name: Crear instalador (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" MusicHub.iss
      - name: Subir instalador (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-Windows-Setup.exe
          path: Output/MusicHub-Windows-Setup.exe
          if-no-files-found: error

      # ---- macOS: DMG (arrastrar a Aplicaciones) ----
      - name: Crear DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          # Firma ad-hoc: evita el error "está dañada" y deja solo el aviso normal
          # de "desarrollador no identificado" (se abre con clic derecho -> Abrir).
          codesign --force --deep -s - "dist/MusicHub.app" || true
          mkdir -p dmg_root
          cp -R "dist/MusicHub.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "MusicHub" -srcfolder dmg_root -ov -format UDZO "MusicHub-macOS.dmg"
      - name: Subir DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: MusicHub-macOS.dmg
          path: MusicHub-macOS.dmg
          if-no-files-found: error

  # Al crear una etiqueta vX.Y, publica una Release con los dos ejecutables.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*
          generate_release_notes: true
