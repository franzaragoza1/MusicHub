name: Compilar MusicHub

# Se ejecuta al hacer push a main, al crear una etiqueta vX.Y (que genera una
# Release con los ejecutables), y a mano desde la pestaña "Actions" (Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
            # Empaqueta la carpeta dist/MusicHub en un zip
            empaquetar: |
              powershell Compress-Archive -Path dist/MusicHub/* -DestinationPath MusicHub-Windows.zip
            artefacto: MusicHub-Windows.zip
          - os: macos-13   # Intel: el .app resultante corre en Mac Intel y Apple Silicon (Rosetta)
            nombre: macOS
            empaquetar: |
              ditto -c -k --keepParent "dist/MusicHub.app" MusicHub-macOS.zip
            artefacto: MusicHub-macOS.zip

    runs-on: ${{ matrix.os }}
    name: Compilar (${{ matrix.nombre }})

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller --noconfirm MusicHub.spec

      - name: Empaquetar
        run: ${{ matrix.empaquetar }}

      - name: Subir el ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: ${{ matrix.artefacto }}
          if-no-files-found: error

  # Al crear una etiqueta vX.Y, publica una Release con los dos ejecutables.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          files: artefactos/**/*
          generate_release_notes: true
